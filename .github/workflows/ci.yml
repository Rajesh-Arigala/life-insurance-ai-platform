name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install CI dependencies
        run: |
          pip install \
            pytest==9.1.1 \
            ruff==0.16.7 \
            PyYAML==6.0.3 \
            python-dotenv==1.2.3

      - name: Run Ruff
        run: ruff check src tests

      - name: Run Pytest
        run: pytest -q
